name: Auto Release on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          # Extract current version
          CURRENT=$(grep "^version = " build.gradle | sed "s/version = ['\"]//;s/['\"]//")
          echo "Current version: $CURRENT"

          # Get previous version
          PREV=$(git show HEAD~1:build.gradle | grep "^version = " | sed "s/version = ['\"]//;s/['\"]//")
          echo "Previous version: $PREV"

          if [ "$CURRENT" != "$PREV" ]; then
            echo "Version changed from $PREV to $CURRENT"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          generate_release_notes: true
