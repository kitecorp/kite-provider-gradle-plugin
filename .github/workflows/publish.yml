name: Auto Release on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          # Extract current version
          CURRENT=$(grep "^version = " build.gradle | sed "s/version = ['\"]//;s/['\"]//")
          echo "Current version: $CURRENT"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

          # Manual dispatch always proceeds
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - proceeding with release"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get previous version
          PREV=$(git show HEAD~1:build.gradle | grep "^version = " | sed "s/version = ['\"]//;s/['\"]//")
          echo "Previous version: $PREV"

          if [ "$CURRENT" != "$PREV" ]; then
            echo "Version changed from $PREV to $CURRENT"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          generate_release_notes: true

  # Call publish workflows after release is created
  publish-gradle-portal:
    needs: release
    if: needs.release.outputs.changed == 'true'
    uses: ./.github/workflows/publish-gradle-portal.yml
    secrets: inherit

  publish-maven-central:
    needs: release
    if: needs.release.outputs.changed == 'true'
    uses: ./.github/workflows/publish-maven-central.yml
    secrets: inherit

  publish-github-packages:
    needs: release
    if: needs.release.outputs.changed == 'true'
    uses: ./.github/workflows/publish-github-packages.yml
    secrets: inherit
