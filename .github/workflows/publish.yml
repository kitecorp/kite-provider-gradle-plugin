name: Auto Release on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - uses: actions/checkout@v6

      - name: Check if version changed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(grep "^version = " build.gradle | sed "s/version = ['\"]//;s/['\"]//")
          echo "Current version: $CURRENT"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

          # Manual dispatch always proceeds
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - proceeding with release"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Release whenever this version has no release yet. Comparing with HEAD~1
          # missed bumps that were not in the last commit of a push.
          if gh release view "v$CURRENT" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$CURRENT already exists"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "No release for v$CURRENT yet"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          generate_release_notes: true

  # Call publish workflows after release is created
  publish-gradle-portal:
    needs: release
    if: needs.release.outputs.changed == 'true'
    uses: ./.github/workflows/publish-gradle-portal.yml
    secrets: inherit

  publish-maven-central:
    needs: release
    if: needs.release.outputs.changed == 'true'
    uses: ./.github/workflows/publish-maven-central.yml
    secrets: inherit

  publish-github-packages:
    needs: release
    if: needs.release.outputs.changed == 'true'
    uses: ./.github/workflows/publish-github-packages.yml
    secrets: inherit
